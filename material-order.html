<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物料下单管理系统</title>
<style>
  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface-alt: #f8fafc;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --primary: #1e40af;
    --primary-hover: #1e3a8a;
    --primary-soft: #dbeafe;

    /* 状态色 */
    --s-pending: #64748b;
    --s-ordered: #0284c7;
    --s-shipping: #d97706;
    --s-partial: #7c3aed;
    --s-done: #059669;
    --s-delayed: #dc2626;

    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 10px 40px rgba(15, 23, 42, 0.12);
    --radius: 8px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* 顶部导航 */
  .app-header {
    background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
    color: white;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(30, 64, 175, 0.3);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-mark {
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    backdrop-filter: blur(10px);
  }

  .header-title h1 {
    font-size: 18px;
    font-weight: 600;
    color: white;
    letter-spacing: 0.5px;
  }

  .header-title .subtitle {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    margin-top: 2px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .reminder-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    color: white;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .reminder-btn:hover {
    background: rgba(255,255,255,0.25);
  }

  .reminder-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    background: #ef4444;
    border-radius: 9px;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #1e3a8a;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-primary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
    white-space: nowrap;
  }

  .btn:hover {
    background: var(--surface-alt);
    border-color: var(--text-muted);
  }

  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }

  .btn-primary:hover {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
  }

  .btn-danger {
    color: var(--s-delayed);
    border-color: #fecaca;
  }

  .btn-danger:hover {
    background: #fef2f2;
    border-color: var(--s-delayed);
  }

  .btn-sm {
    padding: 4px 10px;
    font-size: 12px;
  }

  .header-btn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
  }

  .header-btn:hover {
    background: rgba(255,255,255,0.22);
    border-color: rgba(255,255,255,0.3);
  }

  .header-btn-primary {
    background: #fbbf24;
    border-color: #fbbf24;
    color: #1e3a8a;
    font-weight: 600;
  }

  .header-btn-primary:hover {
    background: #f59e0b;
    border-color: #f59e0b;
  }

  /* 主容器 */
  .main-container {
    max-width: 1600px;
    margin: 0 auto;
    padding: 24px 32px 48px;
  }

  /* 统计卡片 */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .stat-icon {
    width: 42px;
    height: 42px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .stat-icon.total { background: #dbeafe; color: #1d4ed8; }
  .stat-icon.ordered { background: #e0f2fe; color: #0369a1; }
  .stat-icon.shipping { background: #fef3c7; color: #b45309; }
  .stat-icon.done { background: #d1fae5; color: #047857; }
  .stat-icon.delayed { background: #fee2e2; color: #b91c1c; }
  .stat-icon.urgent { background: #fce7f3; color: #be185d; }

  .stat-info .stat-number {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--text-primary);
  }

  .stat-info .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* 工具栏 */
  .toolbar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .toolbar-row + .toolbar-row {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .search-box {
    flex: 1;
    min-width: 240px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 7px 12px 7px 34px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .search-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
  }

  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    opacity: 0.5;
  }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-right: 2px;
  }

  select.filter-select {
    padding: 6px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-family: inherit;
    background: var(--surface);
    color: var(--text-primary);
    cursor: pointer;
    outline: none;
  }

  select.filter-select:focus {
    border-color: var(--primary);
  }

  .toolbar-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* 表格区 */
  .table-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .table-wrapper {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 1100px;
  }

  thead {
    background: var(--surface-alt);
    border-bottom: 2px solid var(--border);
  }

  th {
    padding: 12px 14px;
    text-align: left;
    font-weight: 600;
    color: var(--text-secondary);
    font-size: 12px;
    letter-spacing: 0.01em;
    white-space: nowrap;
    user-select: none;
    position: relative;
  }

  th.sortable {
    cursor: pointer;
  }

  th.sortable:hover {
    color: var(--primary);
  }

  th .sort-icon {
    display: inline-block;
    margin-left: 4px;
    opacity: 0.4;
    font-size: 10px;
  }

  th.sort-asc .sort-icon,
  th.sort-desc .sort-icon {
    opacity: 1;
    color: var(--primary);
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  tbody tr:last-child {
    border-bottom: none;
  }

  tbody tr:hover {
    background: #f8fafc;
  }

  tbody tr.urgent-row {
    background: #fff7ed;
  }

  tbody tr.urgent-row:hover {
    background: #ffedd5;
  }

  tbody tr.delayed-row {
    background: #fef2f2;
  }

  tbody tr.delayed-row:hover {
    background: #fee2e2;
  }

  td {
    padding: 12px 14px;
    vertical-align: top;
  }

  .col-id {
    width: 60px;
    text-align: center;
    font-family: "SF Mono", Consolas, Monaco, monospace;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .col-code {
    width: 140px;
    font-family: "SF Mono", Consolas, Monaco, monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    background: var(--primary-soft);
    padding: 4px 10px;
    border-radius: 4px;
    display: inline-block;
  }

  .col-spec {
    min-width: 200px;
  }

  .spec-name {
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 3px;
    line-height: 1.4;
  }

  .spec-note {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .col-date {
    width: 160px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .date-block {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .date-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .date-label {
    color: var(--text-muted);
    font-size: 11px;
    min-width: 36px;
  }

  .date-value {
    font-family: "SF Mono", Consolas, Monaco, monospace;
    font-size: 12px;
    font-weight: 500;
  }

  .date-value.danger {
    color: var(--s-delayed);
    font-weight: 700;
  }

  .date-value.warning {
    color: #d97706;
    font-weight: 600;
  }

  .col-supplier {
    width: 130px;
  }

  .supplier-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: var(--surface-alt);
    border-radius: 4px;
    font-size: 12px;
    border: 1px solid var(--border);
    font-weight: 500;
  }

  .supplier-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .col-status {
    width: 110px;
  }

  .status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
  }

  .status-badge.pending {
    background: #f1f5f9;
    color: var(--s-pending);
  }
  .status-badge.ordered {
    background: #e0f2fe;
    color: var(--s-ordered);
  }
  .status-badge.shipping {
    background: #fef3c7;
    color: var(--s-shipping);
  }
  .status-badge.partial {
    background: #ede9fe;
    color: var(--s-partial);
  }
  .status-badge.done {
    background: #d1fae5;
    color: var(--s-done);
  }
  .status-badge.delayed {
    background: #fee2e2;
    color: var(--s-delayed);
  }

  .col-countdown {
    width: 110px;
    text-align: center;
  }

  .countdown-tag {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    font-family: "SF Mono", Consolas, monospace;
  }

  .countdown-tag.urgent {
    background: #fee2e2;
    color: var(--s-delayed);
    animation: pulse 1.5s ease-in-out infinite;
  }

  .countdown-tag.warning {
    background: #fef3c7;
    color: #b45309;
  }

  .countdown-tag.normal {
    background: #d1fae5;
    color: #047857;
  }

  .countdown-tag.done {
    background: #f1f5f9;
    color: var(--text-muted);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .col-actions {
    width: 110px;
    text-align: right;
  }

  .action-btns {
    display: flex;
    gap: 4px;
    justify-content: flex-end;
    opacity: 0;
    transition: opacity 0.15s;
  }

  tbody tr:hover .action-btns {
    opacity: 1;
  }

  .icon-btn {
    width: 28px;
    height: 28px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--text-secondary);
    transition: all 0.15s;
  }

  .icon-btn:hover {
    background: var(--surface-alt);
    border-color: var(--border);
    color: var(--text-primary);
  }

  .icon-btn.delete:hover {
    color: var(--s-delayed);
    background: #fef2f2;
    border-color: #fecaca;
  }

  /* 空状态 */
  .empty-state {
    padding: 70px 20px;
    text-align: center;
    color: var(--text-muted);
  }

  .empty-icon {
    font-size: 56px;
    margin-bottom: 18px;
    opacity: 0.4;
  }

  .empty-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .empty-desc {
    font-size: 13px;
    margin-bottom: 20px;
  }

  /* 分页 */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface-alt);
    font-size: 12px;
    color: var(--text-secondary);
  }

  .page-controls {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .page-btn {
    min-width: 28px;
    height: 28px;
    padding: 0 8px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: var(--surface);
    color: var(--text-primary);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }

  .page-btn:hover:not(:disabled) {
    border-color: var(--primary);
    color: var(--primary);
  }

  .page-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }

  .page-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* 模态框 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    backdrop-filter: blur(2px);
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    background: var(--surface);
    border-radius: 8px;
    width: 640px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 60px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-lg);
    transform: translateY(10px) scale(0.98);
    transition: transform 0.2s;
  }

  .modal-overlay.active .modal {
    transform: translateY(0) scale(1);
  }

  .modal-header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-alt);
  }

  .modal-title {
    font-size: 16px;
    font-weight: 600;
  }

  .modal-close {
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    border-radius: 4px;
    cursor: pointer;
    font-size: 18px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-close:hover {
    background: var(--surface);
    color: var(--text-primary);
  }

  .modal-body {
    padding: 22px 24px;
    overflow-y: auto;
    flex: 1;
  }

  .modal-footer {
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    background: var(--surface-alt);
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group:last-child {
    margin-bottom: 0;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .form-label .required {
    color: var(--s-delayed);
    margin-left: 2px;
  }

  .form-control {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    background: var(--surface);
    color: var(--text-primary);
  }

  .form-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
  }

  textarea.form-control {
    resize: vertical;
    min-height: 72px;
    line-height: 1.5;
  }

  .form-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .form-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
  }

  /* 确认对话框 */
  .confirm-dialog {
    width: 400px;
  }

  .confirm-icon {
    font-size: 36px;
    text-align: center;
    margin-bottom: 12px;
  }

  .confirm-title {
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .confirm-message {
    text-align: center;
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  /* 提醒面板 */
  .reminder-panel {
    position: fixed;
    top: 68px;
    right: 32px;
    width: 420px;
    max-height: calc(100vh - 100px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    z-index: 950;
    display: none;
    flex-direction: column;
    overflow: hidden;
    animation: slideDown 0.2s ease-out;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .reminder-panel.active {
    display: flex;
  }

  .reminder-overlay {
    position: fixed;
    inset: 0;
    z-index: 900;
    display: none;
  }

  .reminder-overlay.active {
    display: block;
  }

  .reminder-panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-alt);
  }

  .reminder-panel-title {
    font-size: 14px;
    font-weight: 600;
  }

  .reminder-settings-bar {
    padding: 12px 16px;
    background: var(--surface-alt);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    flex-wrap: wrap;
  }

  .reminder-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .reminder-toggle input {
    cursor: pointer;
    accent-color: var(--primary);
  }

  .reminder-body {
    overflow-y: auto;
    padding: 14px;
    flex: 1;
  }

  .reminder-section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .reminder-count {
    font-size: 11px;
    padding: 2px 8px;
    background: #fee2e2;
    color: var(--s-delayed);
    border-radius: 10px;
    font-weight: 600;
  }

  .reminder-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .reminder-item {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--surface);
    border-left: 3px solid var(--s-shipping);
  }

  .reminder-item:hover {
    background: var(--surface-alt);
    border-color: var(--primary);
  }

  .reminder-item.urgent {
    border-left-color: var(--s-delayed);
    background: #fef2f2;
    animation: urgentPulse 2s ease-in-out infinite;
  }

  @keyframes urgentPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.15); }
    50% { box-shadow: 0 0 0 4px rgba(220, 38, 38, 0); }
  }

  .reminder-item-code {
    font-family: "SF Mono", Consolas, monospace;
    font-size: 11px;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 3px;
  }

  .reminder-item-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 6px;
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .reminder-item-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }

  .reminder-time {
    margin-left: auto;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    font-family: "SF Mono", Consolas, monospace;
    background: #fee2e2;
    color: var(--s-delayed);
  }

  .empty-reminders {
    padding: 24px;
    text-align: center;
    color: var(--text-muted);
  }

  /* 桌面通知 */
  .desktop-notification {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--s-delayed);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 14px 18px;
    z-index: 3000;
    animation: notifSlide 0.3s ease-out;
  }

  @keyframes notifSlide {
    from { opacity: 0; transform: translateX(100%); }
    to { opacity: 1; transform: translateX(0); }
  }

  .notif-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .notif-code {
    font-family: "SF Mono", Consolas, monospace;
    font-size: 11px;
    padding: 2px 6px;
    background: var(--primary-soft);
    color: var(--primary);
    border-radius: 3px;
    font-weight: 700;
  }

  .notif-body {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: 10px;
  }

  .notif-actions {
    display: flex;
    gap: 8px;
  }

  .notif-actions .btn {
    padding: 5px 12px;
    font-size: 12px;
  }

  /* Toast */
  .toast-container {
    position: fixed;
    top: 80px;
    right: 20px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toast {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 13px;
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: slideIn 0.25s ease-out;
    min-width: 200px;
  }

  .toast.success { border-left: 3px solid var(--s-done); }
  .toast.error { border-left: 3px solid var(--s-delayed); }
  .toast.info { border-left: 3px solid var(--primary); }
  .toast.warning { border-left: 3px solid var(--s-shipping); }

  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* 响应式 */
  @media (max-width: 1200px) {
    .stats-row {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 768px) {
    .app-header { padding: 12px 16px; }
    .main-container { padding: 16px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .form-row-2, .form-row-3 { grid-template-columns: 1fr; }
    .modal { width: 95vw; }
    .header-title .subtitle { display: none; }
    .reminder-panel { width: calc(100vw - 32px); right: 16px; }
  }
</style>
</head>
<body>

<!-- 顶部导航 -->
<header class="app-header">
  <div class="header-left">
    <div class="logo-mark">📦</div>
    <div class="header-title">
      <h1>物料下单管理系统</h1>
      <div class="subtitle">Material Order Management System</div>
    </div>
  </div>
  <div class="header-right">
    <button class="reminder-btn" onclick="toggleReminderPanel()">
      ⏰ 交货提醒
      <span class="reminder-badge" id="reminderBadge" style="display:none;">0</span>
    </button>
    <button class="btn header-btn btn-sm" onclick="exportData()" title="导出数据备份">📤 导出</button>
    <button class="btn header-btn btn-sm" onclick="document.getElementById('importFile').click()" title="导入数据">📥 导入</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn header-btn-primary btn-sm" onclick="openModal()">➕ 新建订单</button>
  </div>
</header>

<div class="main-container">

  <!-- 统计卡片 -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon total">📋</div>
      <div class="stat-info">
        <div class="stat-number" id="statTotal">0</div>
        <div class="stat-label">订单总数</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon ordered">📝</div>
      <div class="stat-info">
        <div class="stat-number" id="statOrdered">0</div>
        <div class="stat-label">已下单</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon shipping">🚚</div>
      <div class="stat-info">
        <div class="stat-number" id="statShipping">0</div>
        <div class="stat-label">运输中</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon done">✅</div>
      <div class="stat-info">
        <div class="stat-number" id="statDone">0</div>
        <div class="stat-label">已完成</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon delayed">⚠️</div>
      <div class="stat-info">
        <div class="stat-number" id="statDelayed">0</div>
        <div class="stat-label">已延期</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon urgent">🔥</div>
      <div class="stat-info">
        <div class="stat-number" id="statUrgent">0</div>
        <div class="stat-label">一周内交货</div>
      </div>
    </div>
  </div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <div class="toolbar-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索物料编码、型号规格、供应商、备注..." oninput="renderTable()">
      </div>
      <div class="toolbar-actions">
        <span class="filter-label">状态</span>
        <select class="filter-select" id="filterStatus" onchange="renderTable()">
          <option value="">全部状态</option>
          <option value="pending">待下单</option>
          <option value="ordered">已下单</option>
          <option value="shipping">运输中</option>
          <option value="partial">部分到货</option>
          <option value="done">已完成</option>
          <option value="delayed">已延期</option>
        </select>
        <span class="filter-label">供应商</span>
        <select class="filter-select" id="filterSupplier" onchange="renderTable()">
          <option value="">全部供应商</option>
        </select>
        <span class="filter-label">紧急度</span>
        <select class="filter-select" id="filterUrgency" onchange="renderTable()">
          <option value="">全部</option>
          <option value="urgent">一周内交货</option>
          <option value="delayed">已延期</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 表格 -->
  <div class="table-container">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th class="col-id sortable" onclick="sortBy('id')">序号 <span class="sort-icon">↕</span></th>
            <th class="sortable" onclick="sortBy('code')">物料编码 <span class="sort-icon">↕</span></th>
            <th class="col-spec sortable" onclick="sortBy('spec')">型号规格 <span class="sort-icon">↕</span></th>
            <th class="col-date sortable" onclick="sortBy('orderDate')">下单/交货时间 <span class="sort-icon">↕</span></th>
            <th class="col-supplier sortable" onclick="sortBy('supplier')">供应商 <span class="sort-icon">↕</span></th>
            <th class="sortable" onclick="sortBy('status')">状态 <span class="sort-icon">↕</span></th>
            <th>距交货</th>
            <th class="col-actions">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="empty-icon">📦</div>
      <div class="empty-title">暂无物料订单</div>
      <div class="empty-desc">点击"新建订单"开始记录物料采购信息</div>
      <button class="btn btn-primary" onclick="openModal()">➕ 新建订单</button>
    </div>

    <!-- 分页 -->
    <div class="pagination" id="pagination" style="display:none;">
      <div>共 <span id="totalCount">0</span> 条记录，第 <span id="pageInfo">1/1</span> 页</div>
      <div class="page-controls" id="pageControls"></div>
      <select class="filter-select" id="pageSize" onchange="changePageSize()">
        <option value="10">10条/页</option>
        <option value="20" selected>20条/页</option>
        <option value="50">50条/页</option>
        <option value="100">100条/页</option>
      </select>
    </div>
  </div>
</div>

<!-- 提醒面板 -->
<div class="reminder-overlay" id="reminderOverlay" onclick="closeReminderPanel()"></div>
<div class="reminder-panel" id="reminderPanel">
  <div class="reminder-panel-header">
    <div class="reminder-panel-title">⏰ 交货提醒中心</div>
    <button class="modal-close" onclick="closeReminderPanel()">✕</button>
  </div>
  <div class="reminder-settings-bar">
    <label class="reminder-toggle">
      <input type="checkbox" id="reminderEnabled" checked onchange="toggleReminder(this.checked)">
      <span>开启提醒</span>
    </label>
    <span style="color:var(--text-muted);">|</span>
    <span>提前</span>
    <select id="reminderDays" onchange="changeReminderDays()" class="filter-select" style="padding:3px 8px;font-size:12px;">
      <option value="1">1天</option>
      <option value="3">3天</option>
      <option value="7" selected>7天（1周）</option>
      <option value="14">14天</option>
      <option value="30">30天</option>
    </select>
    <span>提醒</span>
    <button class="btn btn-sm" onclick="requestNotificationPermission()" id="notifyPermBtn" style="margin-left:auto;">🔔 桌面通知</button>
  </div>
  <div class="reminder-body">
    <div class="reminder-section-title">
      <span>🔥 即将交货（一周内）</span>
      <span class="reminder-count" id="upcomingCount">0</span>
    </div>
    <div class="reminder-list" id="reminderList">
      <div class="empty-reminders">
        <div style="font-size:24px;margin-bottom:6px;">✅</div>
        <div style="font-size:12px;color:var(--text-muted);">暂无紧急交货任务</div>
      </div>
    </div>

    <div class="reminder-section-title" style="margin-top:16px;">
      <span>⚠️ 已延期</span>
    </div>
    <div class="reminder-list" id="delayedList">
      <div class="empty-reminders">
        <div style="font-size:12px;color:var(--text-muted);">暂无延期订单</div>
      </div>
    </div>
  </div>
</div>

<!-- 新建/编辑 模态框 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">新建物料订单</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <form id="orderForm">
        <input type="hidden" id="orderId">

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label">物料编码 <span class="required">*</span></label>
            <input type="text" class="form-control" id="code" placeholder="如：MAT-2024-001" maxlength="50" required>
          </div>
          <div class="form-group">
            <label class="form-label">供应商 <span class="required">*</span></label>
            <input type="text" class="form-control" id="supplier" placeholder="供应商名称" maxlength="100" required list="supplierList">
            <datalist id="supplierList"></datalist>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">型号规格 <span class="required">*</span></label>
          <input type="text" class="form-control" id="spec" placeholder="物料名称及规格型号详细描述" maxlength="200" required>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label">下单时间</label>
            <input type="date" class="form-control" id="orderDate">
          </div>
          <div class="form-group">
            <label class="form-label">交货时间 <span class="required">*</span></label>
            <input type="date" class="form-control" id="deliveryDate" required>
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label">数量</label>
            <input type="text" class="form-control" id="quantity" placeholder="如：100个 / 50套" maxlength="50">
          </div>
          <div class="form-group">
            <label class="form-label">完成状态</label>
            <select class="form-control" id="status">
              <option value="pending">待下单</option>
              <option value="ordered">已下单</option>
              <option value="shipping">运输中</option>
              <option value="partial">部分到货</option>
              <option value="done">已完成</option>
              <option value="delayed">已延期</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">备注</label>
          <textarea class="form-control" id="remark" placeholder="采购备注、技术要求、联系方式等..." rows="4" maxlength="1000"></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveOrder()">保存</button>
    </div>
  </div>
</div>

<!-- 确认对话框 -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal confirm-dialog">
    <div class="modal-body">
      <div class="confirm-icon" id="confirmIcon">⚠️</div>
      <div class="confirm-title" id="confirmTitle">确认删除</div>
      <div class="confirm-message" id="confirmMessage">确定要删除这条订单记录吗？</div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeConfirm()">取消</button>
      <button class="btn btn-danger" id="confirmBtn" onclick="executeConfirm()">确认删除</button>
    </div>
  </div>
</div>

<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ========== 数据层 ==========
const STORAGE_KEY = 'material_orders_v1';
const REMINDER_KEY = 'material_reminder_settings_v1';
const NOTIFIED_KEY = 'material_notified_v1';

let orders = [];
let currentPage = 1;
let pageSize = 20;
let sortField = 'id';
let sortDirection = 'desc';
let confirmCallback = null;

// 提醒相关
let reminderSettings = { enabled: true, daysBefore: 7 };
let notifiedOrders = {};
let reminderTimer = null;
let notificationPermission = 'default';
let panelOpen = false;

// 状态配置
const STATUS_CONFIG = {
  pending:  { label: '待下单', color: 'pending' },
  ordered:  { label: '已下单', color: 'ordered' },
  shipping: { label: '运输中', color: 'shipping' },
  partial:  { label: '部分到货', color: 'partial' },
  done:     { label: '已完成', color: 'done' },
  delayed:  { label: '已延期', color: 'delayed' }
};

// 供应商颜色映射缓存
const supplierColors = {};
const colorPalette = [
  '#1e40af', '#0369a1', '#0d9488', '#047857',
  '#b45309', '#c2410c', '#b91c1c', '#be123c',
  '#7c3aed', '#4338ca', '#0f766e', '#15803d'
];

// 初始化
function init() {
  loadData();
  loadReminderSettings();
  loadNotifiedOrders();
  updateSupplierOptions();
  renderTable();
  updateStats();
  checkNotificationPermission();
  startReminderCheck();
  updateReminderBadge();
}

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      orders = JSON.parse(saved);
    } else {
      // 示例数据
      const today = new Date();
      const addDays = (d, n) => {
        const nd = new Date(d);
        nd.setDate(nd.getDate() + n);
        return nd.toISOString().slice(0, 10);
      };

      orders = [
        {
          id: 1,
          code: 'MAT-2026-001',
          spec: 'STM32F407VGT6 微控制器 LQFP-100 工业级',
          orderDate: addDays(today, -10),
          deliveryDate: addDays(today, 3),
          supplier: '深圳华强电子',
          quantity: '500个',
          status: 'shipping',
          remark: '用于主控板量产，已预付30%货款。物流单号 SF1234567890',
          createdAt: Date.now() - 86400000 * 10,
          updatedAt: Date.now() - 86400000 * 2
        },
        {
          id: 2,
          code: 'MAT-2026-002',
          spec: 'PCB 四层板 FR-4 1.6mm 沉金工艺',
          orderDate: addDays(today, -5),
          deliveryDate: addDays(today, 10),
          supplier: '东莞捷多邦电路',
          quantity: '2000片',
          status: 'ordered',
          remark: '打样阶段，预计12天交付。文件版本 V2.3',
          createdAt: Date.now() - 86400000 * 5,
          updatedAt: Date.now() - 86400000 * 5
        },
        {
          id: 3,
          code: 'MAT-2026-003',
          spec: '电容 0805 10uF 25V X5R ±10% 村田',
          orderDate: addDays(today, -15),
          deliveryDate: addDays(today, -2),
          supplier: '上海得捷电子',
          quantity: '10000个',
          status: 'done',
          remark: '已全部到货，质检合格入库。',
          createdAt: Date.now() - 86400000 * 15,
          updatedAt: Date.now() - 86400000 * 1
        },
        {
          id: 4,
          code: 'MAT-2026-004',
          spec: '铝电解电容器 470uF 35V 105℃ 红宝石',

          supplier: '深圳华强电子',
          quantity: '2000个',
          status: 'delayed',
          remark: '供应商反馈生产延误，预计延期一周。正在协调替代品。',
          createdAt: Date.now() - 86400000 * 20,
          updatedAt: Date.now() - 86400000 * 3
        },
        {

          code: 'MAT-2026-005',

          deliveryDate: addDays(today, 5),
          supplier: '东莞立讯精密',
          quantity: '3000个',
          status: 'ordered',
          remark: '用于新版充电器项目。样品已确认。',
          createdAt: Date.now() - 86400000 * 3,
          updatedAt: Date.now() - 86400000 * 3
        },
        {
          id: 6,
          code: 'MAT-2026-006',
          spec: '晶振 8MHz ±20ppm 20pF SMD-3225',
          orderDate: addDays(today, -7),
          deliveryDate: addDays(today, 1),
          supplier: '深圳泰晶科技',
          quantity: '5000个',
          status: 'shipping',
          remark: '快递在途，预计明日送达。',
          createdAt: Date.now() - 86400000 * 7,
          updatedAt: Date.now() - 86400000 * 1
        },
        {
          id: 7,
          code: 'MAT-2026-007',
          spec: '电源模块 DC-DC 12V转5V 3A 隔离型',

          supplier: '北京金升阳',
          quantity: '100个',
          status: 'pending',
          remark: '待技术方案确认后下单，已询价。',
          createdAt: Date.now() - 86400000 * 2,
          updatedAt: Date.now() - 86400000 * 2
        }
      ];
      saveData(true);
    }
  } catch (e) {
    console.error('加载数据失败:', e);
    orders = [];
    showToast('数据加载失败', 'error');

}

function saveData(silent) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
    if (!silent) {
      showToast('保存成功', 'success');
    }
    return true;
  } catch (e) {
    console.error('保存数据失败:', e);
    showToast('保存失败：存储空间不足', 'error');
    return false;
  }
}

// ========== CRUD ==========
function getNextId() {
  if (orders.length === 0) return 1;
  return Math.max(...orders.map(m => m.id)) + 1;
}

function openModal(id) {
  const form = document.getElementById('orderForm');
  form.reset();
  updateSupplierDatalist();

  if (id) {
    const order = orders.find(m => m.id === id);
    if (!order) return;
    document.getElementById('modalTitle').textContent = '编辑订单 #' + id;
    document.getElementById('orderId').value = order.id;
    document.getElementById('code').value = order.code;
    document.getElementById('spec').value = order.spec;
    document.getElementById('orderDate').value = order.orderDate || '';
    document.getElementById('deliveryDate').value = order.deliveryDate || '';
    document.getElementById('supplier').value = order.supplier;
    document.getElementById('quantity').value = order.quantity || '';
    document.getElementById('status').value = order.status;
    document.getElementById('remark').value = order.remark || '';
  } else {
    document.getElementById('modalTitle').textContent = '新建物料订单';
    document.getElementById('orderId').value = '';
    document.getElementById('status').value = 'pending';
    document.getElementById('orderDate').value = new Date().toISOString().slice(0, 10);
  }

  document.getElementById('modalOverlay').classList.add('active');
  setTimeout(() => document.getElementById('code').focus(), 200);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function saveOrder() {
  const code = document.getElementById('code').value.trim();
  const spec = document.getElementById('spec').value.trim();
  const supplier = document.getElementById('supplier').value.trim();
  const deliveryDate = document.getElementById('deliveryDate').value;
  const id = document.getElementById('orderId').value;

  if (!code) { showToast('请输入物料编码', 'warning'); document.getElementById('code').focus(); return; }
  if (!spec) { showToast('请输入型号规格', 'warning'); document.getElementById('spec').focus(); return; }
  if (!supplier) { showToast('请输入供应商', 'warning'); document.getElementById('supplier').focus(); return; }
  if (!deliveryDate) { showToast('请输入交货时间', 'warning'); document.getElementById('deliveryDate').focus(); return; }

  const data = {
    code,
    spec,
    orderDate: document.getElementById('orderDate').value,
    deliveryDate,
    supplier,
    quantity: document.getElementById('quantity').value.trim(),
    status: document.getElementById('status').value,
    remark: document.getElementById('remark').value.trim()
  };

  let isNew = false;

  if (id) {
    const index = orders.findIndex(m => m.id === parseInt(id));
    if (index !== -1) {
      const oldDelivery = orders[index].deliveryDate;
      const oldStatus = orders[index].status;
      orders[index] = { ...orders[index], ...data, updatedAt: Date.now() };

      // 交货时间或状态变更时重置提醒
      if (oldDelivery !== data.deliveryDate || oldStatus !== data.status) {
        resetNotified(parseInt(id));
      }
      showToast('修改成功', 'success');
    }
  } else {
    const newOrder = {
      id: getNextId(),
      ...data,
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    orders.unshift(newOrder);
    isNew = true;
    showToast('创建成功', 'success');
  }

  saveData(true);
  updateSupplierOptions();
  renderTable();
  updateStats();
  updateReminderBadge();
  checkReminders();
  closeModal();
}

function deleteOrder(id) {
  const order = orders.find(m => m.id === id);
  if (!order) return;

  showConfirm(
    '确认删除',
    `确定要删除物料 ${order.code}「${order.spec.substring(0, 30)}${order.spec.length > 30 ? '...' : ''}」吗？`,
    '⚠️',
    () => {
      orders = orders.filter(m => m.id !== id);
      resetNotified(id);
      saveData(true);
      updateSupplierOptions();
      renderTable();
      updateStats();
      updateReminderBadge();
      showToast('已删除', 'success');
    }
  );
}

// ========== 筛选排序 ==========
function getFilteredOrders() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const statusFilter = document.getElementById('filterStatus').value;
  const supplierFilter = document.getElementById('filterSupplier').value;
  const urgencyFilter = document.getElementById('filterUrgency').value;

  let filtered = orders.filter(o => {
    if (statusFilter && o.status !== statusFilter) return false;
    if (supplierFilter && o.supplier !== supplierFilter) return false;
    if (urgencyFilter === 'urgent') {
      if (o.status === 'done') return false;
      const days = getDaysUntilDelivery(o.deliveryDate);
      if (days === null || days > 7) return false;
    }
    if (urgencyFilter === 'delayed') {
      if (o.status === 'done') return false;
      const days = getDaysUntilDelivery(o.deliveryDate);
      if (days === null || days >= 0) return false;
    }
    if (query) {
      const q = query;
      if (
        o.code.toLowerCase().includes(q) ||
        o.spec.toLowerCase().includes(q) ||
        o.supplier.toLowerCase().includes(q) ||
        (o.remark && o.remark.toLowerCase().includes(q))
      ) {
        // match
      } else {
        return false;
      }
    }
    return true;
  });

  // 排序
  filtered.sort((a, b) => {
    let va, vb;
    switch (sortField) {
      case 'id': va = a.id; vb = b.id; break;
      case 'code': va = a.code; vb = b.code; break;
      case 'spec': va = a.spec; vb = b.spec; break;
      case 'orderDate': va = a.orderDate || ''; vb = b.orderDate || ''; break;
      case 'supplier': va = a.supplier; vb = b.supplier; break;
      case 'status':
        const statusOrder = { pending: 0, ordered: 1, shipping: 2, partial: 3, delayed: 4, done: 5 };
        va = statusOrder[a.status]; vb = statusOrder[b.status];
        break;
      default: va = a.id; vb = b.id;
    }
    if (typeof va === 'number' && typeof vb === 'number') {
      return sortDirection === 'asc' ? va - vb : vb - va;
    }
    return sortDirection === 'asc'
      ? String(va).localeCompare(String(vb), 'zh-CN')
      : String(vb).localeCompare(String(va), 'zh-CN');
  });

  return filtered;
}

function sortBy(field) {
  if (sortField === field) {
    sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
  } else {
    sortField = field;
    sortDirection = 'asc';
  }
  renderTable();
}

function updateSupplierOptions() {
  const select = document.getElementById('filterSupplier');
  const current = select.value;
  const suppliers = [...new Set(orders.map(m => m.supplier))].sort();

  select.innerHTML = '<option value="">全部供应商</option>' +
    suppliers.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  select.value = current;

  updateSupplierDatalist();
}

function updateSupplierDatalist() {
  const datalist = document.getElementById('supplierList');
  if (!datalist) return;
  const suppliers = [...new Set(orders.map(m => m.supplier))].sort();
  datalist.innerHTML = suppliers.map(s => `<option value="${escapeHtml(s)}">`).join('');
}

// ========== 渲染 ==========
function renderTable() {
  const tbody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');
  const pagination = document.getElementById('pagination');
  const filtered = getFilteredOrders();

  const totalPages = Math.ceil(filtered.length / pageSize) || 1;
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * pageSize;
  const pageData = filtered.slice(start, start + pageSize);

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
    pagination.style.display = 'none';
    const hasAny = orders.length > 0;
    emptyState.querySelector('.empty-title').textContent = hasAny ? '没有匹配的结果' : '暂无物料订单';
    emptyState.querySelector('.empty-desc').textContent = hasAny
      ? '试试调整筛选条件或搜索关键词'
      : '点击"新建订单"开始记录物料采购信息';
    emptyState.querySelector('button').style.display = hasAny ? 'none' : 'inline-flex';
    return;
  }

  emptyState.style.display = 'none';
  tbody.innerHTML = pageData.map(o => renderTableRow(o)).join('');

  if (filtered.length > pageSize) {
    pagination.style.display = 'flex';
    document.getElementById('totalCount').textContent = filtered.length;
    document.getElementById('pageInfo').textContent = `${currentPage}/${totalPages}`;
    renderPageControls(totalPages);
  } else {
    pagination.style.display = 'flex';
    document.getElementById('totalCount').textContent = filtered.length;
    document.getElementById('pageInfo').textContent = '1/1';
    document.getElementById('pageControls').innerHTML = '';
  }

  // 更新表头排序指示
  document.querySelectorAll('th.sortable').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
  });
  const activeTh = document.querySelector(`th.sortable[onclick*="${sortField}"]`);
  if (activeTh) activeTh.classList.add(sortDirection === 'asc' ? 'sort-asc' : 'sort-desc');
}

function renderTableRow(o) {
  const daysUntil = getDaysUntilDelivery(o.deliveryDate);
  const isDone = o.status === 'done';
  const isDelayed = !isDone && daysUntil !== null && daysUntil < 0;
  const isUrgent = !isDone && daysUntil !== null && daysUntil >= 0 && daysUntil <= 7;

  let rowClass = '';
  if (isDelayed) rowClass = 'delayed-row';
  else if (isUrgent) rowClass = 'urgent-row';

  const countdownClass = isDone ? 'done' : isDelayed ? 'urgent' : isUrgent ? 'warning' : 'normal';
  const countdownText = isDone ? '已完成' :
    daysUntil === null ? '—' :
    daysUntil < 0 ? `逾期 ${Math.abs(daysUntil)}天` :
    daysUntil === 0 ? '今天到期' :
    `${daysUntil}天`;

  const deliveryClass = isDone ? '' : isDelayed ? 'danger' : isUrgent ? 'warning' : '';

  const statusCfg = STATUS_CONFIG[o.status] || STATUS_CONFIG.pending;

  return `
    <tr class="${rowClass}">
      <td class="col-id">#${o.id}</td>
      <td><span class="col-code">${escapeHtml(o.code)}</span></td>
      <td class="col-spec">
        <div class="spec-name">${escapeHtml(o.spec)}</div>
        ${o.quantity ? `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:3px;">📦 ${escapeHtml(o.quantity)}</div>` : ''}
        ${o.remark ? `<div class="spec-note">${escapeHtml(o.remark)}</div>` : ''}
      </td>
      <td class="col-date">
        <div class="date-block">
          <div class="date-item">
            <span class="date-label">下单</span>
            <span class="date-value">${o.orderDate ? formatDate(o.orderDate) : '待下单'}</span>
          </div>
          <div class="date-item">
            <span class="date-label">交货</span>
            <span class="date-value ${deliveryClass}">${o.deliveryDate ? formatDate(o.deliveryDate) : '—'}</span>
          </div>
        </div>
      </td>
      <td class="col-supplier">
        <span class="supplier-tag">
          <span class="supplier-dot" style="background:${getSupplierColor(o.supplier)}"></span>
          ${escapeHtml(o.supplier)}
        </span>
      </td>
      <td class="col-status">
        <span class="status-badge ${statusCfg.color}">${statusCfg.label}</span>
      </td>
      <td class="col-countdown">
        <span class="countdown-tag ${countdownClass}">${countdownText}</span>
      </td>
      <td class="col-actions">
        <div class="action-btns">
          <button class="icon-btn" title="编辑" onclick="openModal(${o.id})">✏️</button>
          <button class="icon-btn delete" title="删除" onclick="deleteOrder(${o.id})">🗑️</button>
        </div>
      </td>
    </tr>
  `;
}

function getDaysUntilDelivery(dateStr) {
  if (!dateStr) return null;
  const delivery = new Date(dateStr);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  delivery.setHours(0, 0, 0, 0);
  const diffMs = delivery - today;
  return Math.ceil(diffMs / (1000 * 60 * 60 * 24));
}

function getSupplierColor(supplier) {
  if (supplierColors[supplier]) return supplierColors[supplier];
  let hash = 0;
  for (let i = 0; i < supplier.length; i++) {
    hash = supplier.charCodeAt(i) + ((hash << 5) - hash);
  }
  const color = colorPalette[Math.abs(hash) % colorPalette.length];
  supplierColors[supplier] = color;
  return color;
}

function renderPageControls(totalPages) {
  const controls = document.getElementById('pageControls');
  let html = '';
  html += `<button class="page-btn" onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>首页</button>`;
  html += `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;

  const maxVisible = 5;
  let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
  let endPage = Math.min(totalPages, startPage + maxVisible - 1);
  if (endPage - startPage < maxVisible - 1) {
    startPage = Math.max(1, endPage - maxVisible + 1);
  }
  for (let i = startPage; i <= endPage; i++) {
    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
  }

  html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
  html += `<button class="page-btn" onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>末页</button>`;
  controls.innerHTML = html;
}

function goToPage(p) {
  currentPage = p;
  renderTable();
}

function changePageSize() {
  pageSize = parseInt(document.getElementById('pageSize').value);
  currentPage = 1;
  renderTable();
}

function updateStats() {
  document.getElementById('statTotal').textContent = orders.length;
  document.getElementById('statOrdered').textContent = orders.filter(o => o.status === 'ordered').length;
  document.getElementById('statShipping').textContent = orders.filter(o => o.status === 'shipping').length;
  document.getElementById('statDone').textContent = orders.filter(o => o.status === 'done').length;
  document.getElementById('statDelayed').textContent = orders.filter(o => o.status === 'delayed').length;

  const urgentCount = orders.filter(o => {
    if (o.status === 'done') return false;
    const days = getDaysUntilDelivery(o.deliveryDate);
    return days !== null && days >= 0 && days <= 7;
  }).length;
  document.getElementById('statUrgent').textContent = urgentCount;
}

// ========== 导入导出 ==========
function exportData() {
  const dataStr = JSON.stringify(orders, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `物料订单数据_${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('数据已导出，可复制到其他电脑导入使用', 'success');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('格式错误');

      showConfirm(
        '导入数据',
        `检测到 ${data.length} 条订单记录。\n是否追加到现有数据？`,
        '📥',
        () => {
          const maxId = orders.length > 0 ? Math.max(...orders.map(m => m.id)) : 0;
          data.forEach((item, idx) => {
            orders.push({
              id: maxId + idx + 1,
              code: item.code || 'UNKNOWN',
              spec: item.spec || '未命名物料',
              orderDate: item.orderDate || '',
              deliveryDate: item.deliveryDate || '',
              supplier: item.supplier || '未知供应商',
              quantity: item.quantity || '',
              status: item.status || 'pending',
              remark: item.remark || '',
              createdAt: item.createdAt || Date.now(),
              updatedAt: Date.now()
            });
          });
          saveData(true);
          updateSupplierOptions();
          renderTable();
          updateStats();
          updateReminderBadge();
          showToast(`成功导入 ${data.length} 条记录`, 'success');
        },
        '确认追加'
      );
    } catch (err) {
      showToast('导入失败：文件格式不正确', 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ========== 提醒功能 ==========
function loadReminderSettings() {
  try {
    const saved = localStorage.getItem(REMINDER_KEY);
    if (saved) {
      reminderSettings = JSON.parse(saved);
      document.getElementById('reminderEnabled').checked = reminderSettings.enabled;
      document.getElementById('reminderDays').value = reminderSettings.daysBefore;
    }
  } catch (e) { console.error(e); }
}

function saveReminderSettings() {
  try { localStorage.setItem(REMINDER_KEY, JSON.stringify(reminderSettings)); } catch (e) {}
}

function loadNotifiedOrders() {
  try {
    const saved = localStorage.getItem(NOTIFIED_KEY);
    if (saved) notifiedOrders = JSON.parse(saved);
  } catch (e) {}
}

function saveNotifiedOrders() {
  try { localStorage.setItem(NOTIFIED_KEY, JSON.stringify(notifiedOrders)); } catch (e) {}
}

function resetNotified(id) {
  if (notifiedOrders[id]) {
    delete notifiedOrders[id];
    saveNotifiedOrders();
  }
}

function toggleReminder(enabled) {
  reminderSettings.enabled = enabled;
  saveReminderSettings();
  updateReminderBadge();
  if (enabled) {
    startReminderCheck();
    showToast('提醒功能已开启', 'success');
  } else {
    stopReminderCheck();
    showToast('提醒功能已关闭', 'info');
  }
}

function changeReminderDays() {
  reminderSettings.daysBefore = parseInt(document.getElementById('reminderDays').value);
  saveReminderSettings();
  updateReminderBadge();
  renderReminderPanelContent();
  showToast(`已设置为提前 ${reminderSettings.daysBefore} 天提醒`, 'success');
}

function toggleReminderPanel() {
  if (panelOpen) {
    closeReminderPanel();
  } else {
    openReminderPanel();
  }
}

function openReminderPanel() {
  renderReminderPanelContent();
  document.getElementById('reminderPanel').classList.add('active');
  document.getElementById('reminderOverlay').classList.add('active');
  panelOpen = true;
}

function closeReminderPanel() {
  document.getElementById('reminderPanel').classList.remove('active');
  document.getElementById('reminderOverlay').classList.remove('active');
  panelOpen = false;
}

function renderReminderPanelContent() {
  const days = reminderSettings.daysBefore;
  const upcoming = [];
  const delayed = [];

  orders.forEach(o => {
    if (o.status === 'done') return;
    const d = getDaysUntilDelivery(o.deliveryDate);
    if (d === null) return;
    if (d < 0) {
      delayed.push(o);
    } else if (d <= days) {
      upcoming.push(o);
    }
  });

  upcoming.sort((a, b) => getDaysUntilDelivery(a.deliveryDate) - getDaysUntilDelivery(b.deliveryDate));
  delayed.sort((a, b) => getDaysUntilDelivery(a.deliveryDate) - getDaysUntilDelivery(b.deliveryDate));

  document.getElementById('upcomingCount').textContent = upcoming.length;

  const upcomingList = document.getElementById('reminderList');
  if (upcoming.length === 0) {
    upcomingList.innerHTML = `
      <div class="empty-reminders">
        <div style="font-size:24px;margin-bottom:6px;">✅</div>
        <div style="font-size:12px;color:var(--text-muted);">未来 ${days} 天内无交货任务</div>
      </div>`;
  } else {
    upcomingList.innerHTML = upcoming.map(o => {
      const daysLeft = getDaysUntilDelivery(o.deliveryDate);
      const isUrgent = daysLeft <= 3;
      return `
        <div class="reminder-item ${isUrgent ? 'urgent' : ''}" onclick="openModal(${o.id}); closeReminderPanel();">
          <div class="reminder-item-code">${escapeHtml(o.code)}</div>
          <div class="reminder-item-title">${escapeHtml(o.spec)}</div>
          <div class="reminder-item-meta">
            <span>🏭 ${escapeHtml(o.supplier)}</span>
            <span class="reminder-time">${daysLeft === 0 ? '今天到期' : daysLeft + '天后交货'}</span>
          </div>
        </div>`;
    }).join('');
  }

  const delayedList = document.getElementById('delayedList');
  if (delayed.length === 0) {
    delayedList.innerHTML = `<div class="empty-reminders"><div style="font-size:12px;color:var(--text-muted);">暂无延期订单</div></div>`;
  } else {
    delayedList.innerHTML = delayed.map(o => {
      const daysLate = Math.abs(getDaysUntilDelivery(o.deliveryDate));
      return `
        <div class="reminder-item urgent" onclick="openModal(${o.id}); closeReminderPanel();">
          <div class="reminder-item-code">${escapeHtml(o.code)}</div>
          <div class="reminder-item-title">${escapeHtml(o.spec)}</div>
          <div class="reminder-item-meta">
            <span>🏭 ${escapeHtml(o.supplier)}</span>
            <span class="reminder-time">逾期 ${daysLate} 天</span>
          </div>
        </div>`;
    }).join('');
  }
}

function updateReminderBadge() {
  const badge = document.getElementById('reminderBadge');
  if (!reminderSettings.enabled) {
    badge.style.display = 'none';
    return;
  }

  let count = 0;
  orders.forEach(o => {
    if (o.status === 'done') return;
    const d = getDaysUntilDelivery(o.deliveryDate);
    if (d !== null && d <= reminderSettings.daysBefore) count++;
  });

  if (count > 0) {
    badge.style.display = 'flex';
    badge.textContent = count;
  } else {
    badge.style.display = 'none';
  }
}

// 定时检查
function startReminderCheck() {
  if (reminderTimer) return;
  checkReminders();
  reminderTimer = setInterval(checkReminders, 60 * 60 * 1000); // 每小时检查一次
}

function stopReminderCheck() {
  if (reminderTimer) {
    clearInterval(reminderTimer);
    reminderTimer = null;
  }
}

function checkReminders() {
  if (!reminderSettings.enabled) return;

  const days = reminderSettings.daysBefore;
  const todayKey = new Date().toDateString();

  orders.forEach(o => {
    if (o.status === 'done') return;
    const d = getDaysUntilDelivery(o.deliveryDate);
    if (d === null) return;

    // 在提醒窗口内（提前N天到逾期）
    if (d <= days && d >= -30) {
      const notifyKey = `${o.id}_${todayKey}`;
      if (notifiedOrders[notifyKey]) return; // 今天已提醒过

      // 标记已提醒
      notifiedOrders[notifyKey] = Date.now();
      // 清理旧记录
      Object.keys(notifiedOrders).forEach(k => {
        const [oid, dateStr] = k.split('_');
        if (parseInt(oid) === o.id && dateStr !== todayKey) {
          delete notifiedOrders[k];
        }
      });
      saveNotifiedOrders();

      triggerReminder(o, d);
    }
  });

  if (panelOpen) renderReminderPanelContent();
  updateReminderBadge();
}

function triggerReminder(order, daysLeft) {
  const title = daysLeft < 0
    ? `⚠️ 物料延期提醒：逾期 ${Math.abs(daysLeft)} 天`
    : daysLeft === 0
    ? `⏰ 今日交货提醒`
    : `⏰ 交货提醒：${daysLeft} 天后交货`;

  const body = `${order.code} - ${order.spec}\n供应商：${order.supplier}\n交货日期：${order.deliveryDate}\n当前状态：${STATUS_CONFIG[order.status]?.label || order.status}`;

  // 桌面通知
  if (notificationPermission === 'granted' && 'Notification' in window) {
    try {
      const n = new Notification(title, { body, tag: `order-${order.id}`, requireInteraction: true });
      n.onclick = () => { window.focus(); openModal(order.id); n.close(); };
      setTimeout(() => n.close(), 30000);
    } catch (e) {}
  }

  // 页面内通知
  showInAppNotification(order, daysLeft);

  // 标题闪烁
  startTitleBlink(title);
}

function showInAppNotification(order, daysLeft) {
  const notif = document.createElement('div');
  notif.className = 'desktop-notification';
  const urgency = daysLeft < 0 ? '已延期' : daysLeft === 0 ? '今日到期' : `${daysLeft}天后交货`;
  notif.innerHTML = `
    <div class="notif-title">
      ⏰ 交货提醒
      <span class="notif-code">${escapeHtml(order.code)}</span>
    </div>
    <div class="notif-body">
      <strong>${escapeHtml(order.spec)}</strong><br>
      🏭 供应商：${escapeHtml(order.supplier)}<br>
      📅 交货日期：${order.deliveryDate}<br>
      <span style="color:var(--s-delayed);font-weight:600;">${urgency}</span>
    </div>
    <div class="notif-actions">
      <button class="btn btn-primary btn-sm" onclick="this.closest('.desktop-notification').remove(); openModal(${order.id});">查看详情</button>
      <button class="btn btn-sm" onclick="this.closest('.desktop-notification').remove();">知道了</button>
    </div>`;
  document.body.appendChild(notif);
  setTimeout(() => {
    if (notif.parentNode) {
      notif.style.opacity = '0';
      notif.style.transform = 'translateX(100%)';
      notif.style.transition = 'all 0.3s ease';
      setTimeout(() => notif.remove(), 300);
    }
  }, 20000);
}

let originalTitle = document.title;
let titleBlinkTimer = null;

function startTitleBlink(blinkText) {
  if (titleBlinkTimer) return;
  let isBlink = false;
  titleBlinkTimer = setInterval(() => {
    document.title = isBlink ? originalTitle : blinkText;
    isBlink = !isBlink;
  }, 1000);
  setTimeout(() => stopTitleBlink(), 60000);
  const stop = () => { stopTitleBlink(); };
  document.addEventListener('click', stop, { once: true });
  document.addEventListener('keydown', stop, { once: true });
}

function stopTitleBlink() {
  if (titleBlinkTimer) {
    clearInterval(titleBlinkTimer);
    titleBlinkTimer = null;
    document.title = originalTitle;
  }
}

function checkNotificationPermission() {
  if (!('Notification' in window)) {
    notificationPermission = 'unsupported';
    return;
  }
  notificationPermission = Notification.permission;
  updateNotifyPermButton();
}

function requestNotificationPermission() {
  if (!('Notification' in window)) {
    showToast('当前浏览器不支持桌面通知', 'warning');
    return;
  }
  Notification.requestPermission().then(p => {
    notificationPermission = p;
    updateNotifyPermButton();
    if (p === 'granted') {
      showToast('桌面通知已开启', 'success');
      new Notification('物料下单管理系统', {
        body: '桌面通知已启用，物料交货前会自动提醒您。'
      });
    } else {
      showToast('已拒绝通知权限，可在浏览器设置中重新开启', 'warning');
    }
  });
}

function updateNotifyPermButton() {
  const btn = document.getElementById('notifyPermBtn');
  if (!btn) return;
  switch (notificationPermission) {
    case 'granted':
      btn.textContent = '✅ 已开启';
      btn.disabled = true;
      btn.style.opacity = '0.7';
      break;
    case 'denied':
      btn.textContent = '⛔ 被拒绝';
      btn.disabled = true;
      btn.style.opacity = '0.7';
      break;
    case 'unsupported':
      btn.textContent = '不支持';
      btn.disabled = true;
      btn.style.style.opacity = '0.7';
      break;
    default:
      btn.textContent = '🔔 桌面通知';
      btn.disabled = false;
      btn.style.opacity = '1';
  }
}

// ========== 工具函数 ==========
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: '✓', error: '✕', warning: '!', info: 'i' };
  toast.innerHTML = `<span>${icons[type] || ''}</span><span>${escapeHtml(message)}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    toast.style.transition = 'all 0.25s ease-in';
    setTimeout(() => toast.remove(), 250);
  }, 2500);
}

function showConfirm(title, message, icon, callback, btnText = '确认删除') {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMessage').textContent = message;
  document.getElementById('confirmIcon').textContent = icon;
  document.getElementById('confirmBtn').textContent = btnText;
  confirmCallback = callback;
  document.getElementById('confirmOverlay').classList.add('active');
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('active');
  confirmCallback = null;
}

function executeConfirm() {
  if (confirmCallback) confirmCallback();
  closeConfirm();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
}

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('confirmOverlay').classList.contains('active')) closeConfirm();
    else if (document.getElementById('modalOverlay').classList.contains('active')) closeModal();
    else if (panelOpen) closeReminderPanel();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
    e.preventDefault();
    openModal();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveData();
  }
});

// 点击遮罩关闭
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});
document.getElementById('confirmOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeConfirm();
});

// 启动
init();
</script>
</body>
</html>
